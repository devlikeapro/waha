name: Tests

on:
  push:
    branches: [main, core, develop]
  pull_request:
    branches: [main, core, develop]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    name: Node.js Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn oxlint src apps libs --ignore-pattern "**/_nuxt/**" --ignore-pattern "**/dashboard/**/*.js" --ignore-pattern "**/_lodash.js"

      - name: Build
        run: yarn build

      - name: Run unit tests
        run: yarn test:unit

      - name: Run e2e tests
        run: yarn test:e2e

  python-tests:
    runs-on: ubuntu-latest
    name: Python Vision Worker Tests
    defaults:
      run:
        working-directory: apps/vision-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
