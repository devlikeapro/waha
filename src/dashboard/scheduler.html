<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAHA Scheduler</title>
    
    <!-- Scripts -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- PrimeVue Core & Components (UMD) -->
    <script src="https://unpkg.com/primevue@3.40.1/core/core.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/button/button.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/inputtext/inputtext.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/textarea/textarea.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/dropdown/dropdown.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/calendar/calendar.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/toast/toast.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/toastservice/toastservice.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/selectbutton/selectbutton.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/datatable/datatable.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/column/column.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/card/card.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/panel/panel.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/confirmdialog/confirmdialog.min.js"></script>
    <script src="https://unpkg.com/primevue@3.40.1/confirmationservice/confirmationservice.min.js"></script>

    <!-- Styles -->
    <link href="https://unpkg.com/primevue@3.40.1/resources/primevue.min.css" rel="stylesheet">
    <link href="https://unpkg.com/primeicons/primeicons.css" rel="stylesheet">
    <link href="https://unpkg.com/primeflex@3.3.1/primeflex.min.css" rel="stylesheet">
    
    <!-- Use the LOCAL theme from the dashboard to match perfectly -->
    <!-- Load LAST to override defaults -->
    <link rel="stylesheet" href="/dashboard/themes/lara-dark-green/theme.css">

    <style>
        /* Fix for missing backgrounds on overlays when mixing CDN PrimeVue with Nuxt Theme */
        .p-dropdown-panel, .p-datepicker, .p-dialog, .p-overlay {
            background-color: var(--surface-overlay) !important;
            color: var(--text-color) !important;
        }
        .p-dropdown-item {
            color: var(--text-color) !important;
        }
        .p-dropdown-item:hover {
            background-color: var(--surface-hover) !important;
        }
        
        body {
            margin: 0;
            background-color: var(--surface-ground);
            color: var(--text-color);
            font-family: var(--font-family);
        }
        .layout-wrapper {
            display: flex;
            min-height: 100vh;
        }
        .layout-sidebar {
            width: 250px;
            background-color: var(--surface-overlay);
            border-right: 1px solid var(--surface-border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            position: fixed;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 999;
        }
        .layout-main {
            flex: 1;
            margin-left: 250px;
            padding: 2rem;
            background-color: var(--surface-ground);
        }
        .nav-item {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            color: var(--text-color);
            display: flex;
            align-items: center;
            text-decoration: none;
            margin-bottom: 0.5rem;
        }
        .nav-item:hover {
            background-color: var(--surface-hover);
        }
        .nav-item.active {
            background-color: var(--primary-color);
            color: var(--primary-color-text);
        }
        .nav-item i {
            margin-right: 0.75rem;
        }
        .status-badge {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }
        .status-working { background-color: var(--green-500); }
        .status-failed { background-color: var(--red-500); }
        .status-stopped { background-color: var(--gray-500); }
        
        /* PrimeVue overrides/helpers */
        .p-field { margin-bottom: 1.5rem; }
        .w-full { width: 100%; }
        .file-upload-box {
            border: 2px dashed var(--surface-border);
            border-radius: 6px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-upload-box:hover {
            border-color: var(--primary-color);
        }
        .file-upload-box.drag-active {
            border-color: var(--primary-color);
            background-color: var(--surface-hover);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="layout-wrapper">
            <!-- Sidebar -->
            <div class="layout-sidebar shadow-2">
                <div class="mb-4 mt-2 px-2 flex align-items-center">
                    <img src="/dashboard/layout/images/logo-white.svg" alt="WAHA" style="height: 24px;" class="mr-2">
                    <span class="font-bold text-xl">Scheduler</span>
                </div>
                
                <a href="/dashboard/" class="nav-item">
                    <i class="pi pi-arrow-left"></i>
                    <span>Back to Dashboard</span>
                </a>
                
                <div class="p-divider p-component p-divider-horizontal p-divider-solid p-divider-left" role="separator"></div>
                
                <div class="px-2 mb-3">
                    <label class="text-xs text-500 font-bold mb-2 block">SESSION</label>
                    <p-dropdown v-model="selectedSession" :options="sessions" option-label="name" option-value="name" placeholder="Select Session" class="w-full" @change="onSessionChange"></p-dropdown>
                    <div class="mt-2 text-sm" v-if="currentSession">
                        <span class="status-badge" :class="'status-' + (currentSession.status || '').toLowerCase()"></span>
                        {{ currentSession.status }}
                    </div>
                </div>

                <div class="px-2 mb-3">
                    <label class="text-xs text-500 font-bold mb-2 block">API KEY</label>
                    <p-inputtext type="password" v-model="apiKey" class="w-full p-inputtext-sm" placeholder="Enter API Key" @input="saveApiKey"></p-inputtext>
                </div>

                <div class="p-divider p-component p-divider-horizontal p-divider-solid p-divider-left" role="separator"></div>

                <div class="nav-item" :class="{ active: view === 'send' }" @click="view = 'send'">
                    <i class="pi pi-send"></i>
                    <span>Direct Send</span>
                </div>
                <div class="nav-item" :class="{ active: view === 'schedule' }" @click="view = 'schedule'">
                    <i class="pi pi-calendar-plus"></i>
                    <span>Schedule Message</span>
                </div>
                <div class="nav-item" :class="{ active: view === 'jobs' }" @click="fetchJobs(); view = 'jobs'">
                    <i class="pi pi-list"></i>
                    <span>Scheduled Jobs</span>
                </div>
            </div>

            <!-- Main Content -->
            <div class="layout-main">
                <p-toast></p-toast>
                <p-confirmdialog></p-confirmdialog>

                <!-- Send / Schedule Form -->
                <div v-if="view === 'send' || view === 'schedule'" class="fadein animation-duration-300">
                    <div class="flex justify-content-between align-items-center mb-4">
                        <h2 class="m-0">{{ view === 'send' ? 'Direct Send' : 'Schedule Message' }}</h2>
                    </div>

                    <div class="grid">
                        <div class="col-12 lg:col-8">
                            <p-card>
                                <template #content>
                                    <!-- Schedule Specific Fields -->
                                    <div v-if="view === 'schedule'" class="formgrid grid mb-4">
                                        <div class="field col-12 md:col-6">
                                            <label for="schedId" class="font-bold block mb-2">Job ID (Optional)</label>
                                            <p-inputtext id="schedId" v-model="scheduleForm.id" class="w-full" placeholder="Auto-generated if empty"></p-inputtext>
                                        </div>
                                        <div class="field col-12 md:col-6">
                                            <label for="executeAt" class="font-bold block mb-2">Execute At</label>
                                            <p-calendar id="executeAt" v-model="scheduleForm.executeAt" :show-time="true" :show-seconds="true" class="w-full" placeholder="Select date & time"></p-calendar>
                                        </div>
                                    </div>
                                    <div v-if="view === 'schedule'" class="p-divider p-component p-divider-horizontal p-divider-solid p-divider-left mb-4" role="separator"></div>

                                    <!-- Common Fields -->
                                    <div class="formgrid grid">
                                        <div class="field col-12 md:col-6">
                                            <label for="chatId" class="font-bold block mb-2">Phone Number (Chat ID)</label>
                                            <p-inputtext id="chatId" v-model="form.chatId" class="w-full" placeholder="12125551234@c.us"></p-inputtext>
                                            <small class="text-secondary block mt-1">International format without +, append @c.us</small>
                                        </div>
                                        <div class="field col-12 md:col-6">
                                            <label for="type" class="font-bold block mb-2">Message Type</label>
                                            <p-dropdown id="type" v-model="form.type" :options="messageTypes" option-label="label" option-value="value" class="w-full"></p-dropdown>
                                        </div>
                                    </div>

                                    <div class="field" v-if="['text', 'image', 'file', 'video'].includes(form.type)">
                                        <label for="text" class="font-bold block mb-2">{{ form.type === 'text' ? 'Message' : 'Caption' }}</label>
                                        <p-textarea id="text" v-model="form.text" rows="3" class="w-full" :auto-resize="true"></p-textarea>
                                    </div>

                                    <!-- Media Handling -->
                                    <div v-if="form.type !== 'text'" class="surface-ground p-3 border-round mb-3">
                                        <div class="field">
                                            <label class="font-bold block mb-2">Media Source</label>
                                            <p-selectbutton v-model="form.mediaSource" :options="mediaSourceOptions" option-label="name" option-value="value"></p-selectbutton>
                                        </div>

                                        <div v-if="form.mediaSource === 'url'" class="field mb-0">
                                            <label for="fileUrl" class="font-bold block mb-2">File URL</label>
                                            <div class="p-inputgroup">
                                                <span class="p-inputgroup-addon">
                                                    <i class="pi pi-link"></i>
                                                </span>
                                                <p-inputtext id="fileUrl" v-model="form.fileUrl" placeholder="https://example.com/file.jpg"></p-inputtext>
                                            </div>
                                        </div>

                                        <div v-if="form.mediaSource === 'upload'" class="field mb-0">
                                            <label for="fileUpload" class="font-bold block mb-2">Upload File</label>
                                            <div class="file-upload-box" 
                                                 :class="{ 'drag-active': isDragging }"
                                                 @click="$refs.fileInput.click()"
                                                 @dragover.prevent="isDragging = true"
                                                 @dragleave.prevent="isDragging = false"
                                                 @drop.prevent="handleDrop">
                                                <input type="file" ref="fileInput" @change="handleFileUpload" style="display: none">
                                                <div v-if="!form.fileData">
                                                    <i class="pi pi-cloud-upload text-4xl text-500 mb-2"></i>
                                                    <p class="m-0">Click or Drag & Drop file here</p>
                                                </div>
                                                <div v-else class="flex align-items-center justify-content-center gap-2">
                                                    <i class="pi pi-file text-primary text-xl"></i>
                                                    <span class="font-bold">{{ form.fileData.filename }}</span>
                                                    <span class="text-500">({{ formatFileSize(form.fileData.data.length * 0.75) }})</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="field" v-if="form.type !== 'text'">
                                        <label for="filename" class="font-bold block mb-2">Filename (Optional)</label>
                                        <p-inputtext id="filename" v-model="form.filename" class="w-full" placeholder="custom-name.jpg"></p-inputtext>
                                    </div>

                                    <div class="mt-5">
                                        <p-button :label="view === 'send' ? 'Send Message' : 'Schedule Message'" 
                                                  :icon="view === 'send' ? 'pi pi-send' : 'pi pi-calendar-plus'" 
                                                  :loading="loading" 
                                                  class="w-full p-button-lg"
                                                  @click="view === 'send' ? sendMessage() : scheduleMessage()"></p-button>
                                    </div>
                                </template>
                            </p-card>

                            <div v-if="lastResponse" class="mt-4">
                                <p-panel header="Last Response" :toggleable="true">
                                    <pre class="m-0" style="white-space: pre-wrap; word-break: break-all;">{{ JSON.stringify(lastResponse, null, 2) }}</pre>
                                </p-panel>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Scheduled Jobs View -->
                <div v-if="view === 'jobs'" class="fadein animation-duration-300">
                    <div class="flex justify-content-between align-items-center mb-4">
                        <h2 class="m-0">Scheduled Jobs</h2>
                        <p-button icon="pi pi-refresh" label="Refresh" outlined @click="fetchJobs"></p-button>
                    </div>

                    <p-card>
                        <template #content>
                            <p-datatable :value="jobs" responsive-layout="scroll" :loading="loading" striped-rows>
                                <template #empty>No scheduled jobs found.</template>
                                <p-column field="id" header="Job ID"></p-column>
                                <p-column field="nextExecution" header="Next Execution">
                                    <template #body="slotProps">
                                        {{ formatTime(slotProps.data.nextExecution) }}
                                    </template>
                                </p-column>
                                <p-column header="Actions" style="width: 100px">
                                    <template #body="slotProps">
                                        <p-button icon="pi pi-trash" class="p-button-danger p-button-sm p-button-text" @click="cancelJob(slotProps.data.id)" label="Cancel"></p-button>
                                    </template>
                                </p-column>
                            </p-datatable>
                        </template>
                    </p-card>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const { useToast } = primevue.usetoast;
        const { useConfirm } = primevue.useconfirm;

        const app = createApp({
            setup() {
                const toast = useToast();
                const confirm = useConfirm();

                // State
                const view = ref('send');
                const loading = ref(false);
                const isDragging = ref(false);
                const sessions = ref([]);
                const selectedSession = ref('');
                const lastResponse = ref(null);
                
                // API Key Logic
                let key = localStorage.getItem('waha_api_key') || '';
                if (!key) {
                    try {
                        const servers = JSON.parse(localStorage.getItem('servers'));
                        if (Array.isArray(servers) && servers.length > 0 && servers[0].connection && servers[0].connection.key) {
                            key = servers[0].connection.key;
                        }
                    } catch (e) {
                        console.log('Could not load key from dashboard servers config');
                    }
                }
                const apiKey = ref(key);

                // Forms
                const form = ref({
                    chatId: '',
                    type: 'text',
                    text: '',
                    fileUrl: '',
                    filename: '',
                    mediaSource: 'url',
                    fileData: null
                });

                const scheduleForm = ref({
                    id: '',
                    executeAt: null
                });

                const jobs = ref([]);

                // Constants
                const messageTypes = [
                    { label: 'Text', value: 'text' },
                    { label: 'Image', value: 'image' },
                    { label: 'File', value: 'file' },
                    { label: 'Voice', value: 'voice' },
                    { label: 'Video', value: 'video' }
                ];

                const mediaSourceOptions = [
                    { name: 'Link (URL)', value: 'url' },
                    { name: 'Upload File', value: 'upload' }
                ];

                // Computed
                const currentSession = computed(() => sessions.value.find(s => s.name === selectedSession.value));

                // Methods
                const saveApiKey = () => {
                    localStorage.setItem('waha_api_key', apiKey.value);
                    setupAxios();
                    fetchSessions();
                };

                const setupAxios = () => {
                    axios.interceptors.request.use(config => {
                        if (apiKey.value) {
                            config.headers['X-Api-Key'] = apiKey.value;
                        }
                        return config;
                    });
                };

                const showToast = (severity, summary, detail) => {
                    toast.add({ severity, summary, detail, life: 3000 });
                };

                const fetchSessions = async () => {
                    try {
                        const res = await axios.get('/api/sessions?all=true');
                        sessions.value = res.data;
                        if (sessions.value.length > 0 && !selectedSession.value) {
                            selectedSession.value = sessions.value[0].name;
                        }
                    } catch (e) {
                        showToast('error', 'Error', 'Failed to fetch sessions');
                    }
                };

                const formatFileSize = (bytes) => {
                    if (bytes === 0) return '0 Bytes';
                    const k = 1024;
                    const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                };

                const formatTime = (isoString) => {
                    if (!isoString) return '-';
                    if (isoString === 'finished') return 'Finished';
                    return new Date(isoString).toLocaleString();
                };

                const handleFileUpload = (event) => {
                    const file = event.target.files[0];
                    processFile(file);
                };

                const handleDrop = (event) => {
                    isDragging.value = false;
                    const file = event.dataTransfer.files[0];
                    processFile(file);
                };

                const processFile = (file) => {
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const result = e.target.result;
                        const parts = result.split(',');
                        const mime = parts[0].match(/:(.*?);/)[1];
                        const data = parts[1];
                        
                        form.value.fileData = {
                            mimetype: mime,
                            data: data,
                            filename: file.name
                        };
                        if (!form.value.filename) {
                            form.value.filename = file.name;
                        }
                    };
                    reader.readAsDataURL(file);
                };

                const getPayload = () => {
                    const payload = {
                        session: selectedSession.value,
                        chatId: form.value.chatId,
                    };

                    if (form.value.type === 'text') {
                        payload.text = form.value.text;
                    } else {
                        if (form.value.mediaSource === 'upload' && form.value.fileData) {
                            payload.file = {
                                mimetype: form.value.fileData.mimetype,
                                data: form.value.fileData.data,
                                filename: form.value.filename || form.value.fileData.filename
                            };
                        } else {
                            payload.file = { 
                                url: form.value.fileUrl, 
                                filename: form.value.filename 
                            };
                        }
                        payload.caption = form.value.text;
                    }
                    return payload;
                };

                const sendMessage = async () => {
                    loading.value = true;
                    lastResponse.value = null;
                    try {
                        const payload = getPayload();
                        let endpoint = '/api/sendText';
                        if (form.value.type === 'image') endpoint = '/api/sendImage';
                        if (form.value.type === 'file') endpoint = '/api/sendFile';
                        if (form.value.type === 'voice') endpoint = '/api/sendVoice';
                        if (form.value.type === 'video') endpoint = '/api/sendVideo';

                        const res = await axios.post(endpoint, payload);
                        lastResponse.value = res.data;
                        showToast('success', 'Success', 'Message sent successfully!');
                    } catch (e) {
                        showToast('error', 'Error', e.response?.data?.message || e.message);
                    } finally {
                        loading.value = false;
                    }
                };

                const scheduleMessage = async () => {
                    if (!scheduleForm.value.executeAt) {
                        showToast('warn', 'Validation', 'Please select execution time');
                        return;
                    }
                    loading.value = true;
                    lastResponse.value = null;
                    try {
                        const payload = getPayload();
                        const id = scheduleForm.value.id || 'job-' + Date.now();
                        const req = {
                            id: id,
                            executeAt: scheduleForm.value.executeAt.toISOString(),
                            type: form.value.type,
                            payload: payload
                        };

                        const res = await axios.post('/api/scheduler/schedule', req);
                        lastResponse.value = res.data;
                        showToast('success', 'Success', 'Message scheduled successfully!');
                        scheduleForm.value.id = '';
                        scheduleForm.value.executeAt = null;
                    } catch (e) {
                        showToast('error', 'Error', e.response?.data?.message || e.message);
                    } finally {
                        loading.value = false;
                    }
                };

                const fetchJobs = async () => {
                    loading.value = true;
                    try {
                        const res = await axios.get('/api/scheduler/jobs');
                        jobs.value = res.data;
                    } catch (e) {
                        showToast('error', 'Error', 'Failed to fetch jobs');
                    } finally {
                        loading.value = false;
                    }
                };

                const cancelJob = (id) => {
                    confirm.require({
                        message: 'Are you sure you want to cancel this job?',
                        header: 'Confirmation',
                        icon: 'pi pi-exclamation-triangle',
                        accept: async () => {
                            try {
                                await axios.delete('/api/scheduler/jobs/' + id);
                                fetchJobs();
                                showToast('success', 'Success', 'Job cancelled');
                            } catch (e) {
                                showToast('error', 'Error', 'Failed to cancel job');
                            }
                        }
                    });
                };

                onMounted(() => {
                    setupAxios();
                    fetchSessions();
                });

                return {
                    view, loading, isDragging, sessions, selectedSession, currentSession, apiKey,
                    form, scheduleForm, jobs, lastResponse,
                    messageTypes, mediaSourceOptions,
                    saveApiKey, handleFileUpload, handleDrop, sendMessage, scheduleMessage, fetchJobs, cancelJob,
                    formatFileSize, formatTime
                };
            }
        });

        app.use(primevue.config.default);
        app.use(primevue.toastservice);
        app.use(primevue.confirmationservice);

        app.component('p-button', primevue.button);
        app.component('p-inputtext', primevue.inputtext);
        app.component('p-textarea', primevue.textarea);
        app.component('p-dropdown', primevue.dropdown);
        app.component('p-calendar', primevue.calendar);
        app.component('p-toast', primevue.toast);
        app.component('p-selectbutton', primevue.selectbutton);
        app.component('p-datatable', primevue.datatable);
        app.component('p-column', primevue.column);
        app.component('p-card', primevue.card);
        app.component('p-panel', primevue.panel);
        app.component('p-confirmdialog', primevue.confirmdialog);

        app.mount('#app');
    </script>
</body>
</html>
