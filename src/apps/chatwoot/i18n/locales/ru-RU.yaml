app.connected.message: |-
  🔗 **ПОДКЛЮЧЕНО: Сессия WhatsApp к ChatWoot Inbox**

  ✅ Сессия WhatsApp **{{{name}}}** была успешно подключена к этому ChatWoot Inbox.

  Этот inbox теперь связан с вашим **аккаунтом WhatsApp**. Вы можете отправлять и получать сообщения прямо отсюда — как в WhatsApp, но внутри ChatWoot.

  Вы также можете управлять сессией WhatsApp, связанной с этим inbox. Чтобы увидеть доступные действия, отправьте **help** в этот чат.

  📋 Общие действия, которые вы можете выполнить:
  - Проверить, активна ли сессия WhatsApp
  - Перезапустить или остановить сессию WhatsApp
  - Выйти и переподключиться, отсканировав новый QR-код

  Если всё работает, вы сможете свободно общаться. Если вы видите предупреждения, возможно, вам потребуется переподключить ваш аккаунт WhatsApp.

  Давайте начнем! 🚀

app.disconnected.message: |-
  🔌 **ОТКЛЮЧЕНО: Сессия WhatsApp от ChatWoot Inbox**

  ❌ Сессия WhatsApp **{{{name}}}** была отключена от этого ChatWoot Inbox.

  Вы больше не сможете отправлять или получать сообщения из WhatsApp.

  Для переподключения, пожалуйста, обратитесь к вашему администратору.

app.updated.message: |-
  🔄 **ОБНОВЛЕНО: Настройки сессии WhatsApp**

  ✅ Настройки для сессии WhatsApp **{{{name}}}** были обновлены.

app.commands.list: |-
  Вы можете управлять **WhatsApp Интеграцией**, отправив одну из следующих команд:

  🖥️ **Сессия**:
  1. **status** - получить текущий статус сессии.
  2. **restart** - перезапустить сессию - это попытается переподключить ваш аккаунт WhatsApp.
  3. **start** - запустить сессию.
  4. **stop** - остановить сессию.
  5. **logout** - выйти из сессии, чтобы вы могли отсканировать QR-код и восстановить сессию.
  6. **qr** - получить QR-код для сессии.
  7. **screenshot** - получить скриншот сессии (доступно только в движке **WEBJS**).
  8. **help** - доступные команды.

  {{#commands.server}}
  ⚙️ Сервер:
  - **server status** - получить информацию о версии и статусе сервера.
  - **server reboot** - корректно перезагрузить сервер.
  - **server reboot force** - принудительно перезагрузить сервер.
  {{/commands.server}}

  Отправьте **команду** (без учета регистра) или **номер команды** в этот разговор.

app.commands.server.disabled: ⛔ **Команды сервера отключены**.

  Пожалуйста, свяжитесь с вашим администратором.

  Отправьте **help**, чтобы получить список доступных команд.

