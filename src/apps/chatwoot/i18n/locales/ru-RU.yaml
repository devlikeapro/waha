waha.core.version.used: |-
  ❤️ **Поддержите WAHA!**

  Вы используете бесплатную версию **WAHA Core**. Если вы находите этот проект полезным, пожалуйста, рассмотрите возможность поддержать его разработку.

  Ваша поддержка - единственный способ, которым мы можем продолжать работать над обновлениями, исправлениями и новыми функциями.

  [**🎁 Поддержать нас**]({{{supportUrl}}})

