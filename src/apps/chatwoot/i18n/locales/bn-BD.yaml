app.connected.message: |-
  🔗 **সংযুক্ত: হোয়াটসঅ্যাপ সেশন থেকে ChatWoot ইনবক্স**

  ✅ হোয়াটসঅ্যাপ সেশন **{{{name}}}** সফলভাবে এই ChatWoot ইনবক্সের সাথে সংযুক্ত করা হয়েছে।

  এই ইনবক্সটি এখন আপনার **হোয়াটসঅ্যাপ অ্যাকাউন্টের** সাথে সংযুক্ত। আপনি এখান থেকে সরাসরি বার্তা পাঠাতে এবং গ্রহণ করতে পারেন — ঠিক হোয়াটসঅ্যাপ ব্যবহার করার মতো, কিন্তু ChatWoot এর ভিতরে।

  আপনি এই ইনবক্সের সাথে সংযুক্ত হোয়াটসঅ্যাপ সেশনও পরিচালনা করতে পারেন। উপলব্ধ কার্যগুলি দেখতে, এই চ্যাটে **help** পাঠান।

  📋 আপনি যে সাধারণ কাজগুলি করতে পারেন:
  - হোয়াটসঅ্যাপ সেশন সক্রিয় কিনা তা পরীক্ষা করুন
  - হোয়াটসঅ্যাপ সেশন পুনরায় চালু করুন বা বন্ধ করুন
  - লগ আউট করুন এবং নতুন QR কোড স্ক্যান করে পুনরায় সংযোগ করুন

  যদি সবকিছু কাজ করে, আপনি স্বাধীনভাবে চ্যাট করতে পারবেন। যদি আপনি সতর্কতা দেখেন, আপনাকে আপনার হোয়াটসঅ্যাপ অ্যাকাউন্ট পুনরায় সংযোগ করতে হতে পারে।

  চলুন শুরু করা যাক! 🚀

app.disconnected.message: |-
  🔌 **সংযোগ বিচ্ছিন্ন: হোয়াটসঅ্যাপ সেশন থেকে ChatWoot ইনবক্স**

  ❌ হোয়াটসঅ্যাপ সেশন **{{{name}}}** এই ChatWoot ইনবক্স থেকে সংযোগ বিচ্ছিন্ন করা হয়েছে।

  আপনি আর হোয়াটসঅ্যাপ থেকে বার্তা পাঠাতে বা গ্রহণ করতে পারবেন না।

  পুনরায় সংযোগ করতে, অনুগ্রহ করে আপনার প্রশাসকের সাথে যোগাযোগ করুন।

app.updated.message: |-
  🔄 **আপডেট করা হয়েছে: হোয়াটসঅ্যাপ সেশন সেটিংস**

  ✅ হোয়াটসঅ্যাপ সেশন **{{{name}}}** এর সেটিংস আপডেট করা হয়েছে।

app.commands.list: |-
  আপনি নিম্নলিখিত কমান্ডগুলির একটি পাঠিয়ে **হোয়াটসঅ্যাপ ইন্টিগ্রেশন** পরিচালনা করতে পারেন:

  🖥️ **সেশন**:
  1. **status** - বর্তমান সেশনের স্ট্যাটাস পান।
  2. **restart** - সেশন পুনরায় চালু করুন - এটি আপনার হোয়াটসঅ্যাপ অ্যাকাউন্ট পুনরায় সংযোগ করার চেষ্টা করবে।
  3. **start** - সেশন শুরু করুন।
  4. **stop** - সেশন বন্ধ করুন।
  5. **logout** - সেশন থেকে লগআউট করুন, যাতে আপনি QR কোড স্ক্যান করতে পারেন এবং সেশন মেরামত করতে পারেন।
  6. **qr** - সেশনের জন্য QR কোড পান।
  7. **screenshot** - সেশনের স্ক্রিনশট পান (শুধুমাত্র **WEBJS** ইঞ্জিনে উপলব্ধ)।
  8. **help** - উপলব্ধ কমান্ডগুলি।

  {{#commands.server}}
  ⚙️ সার্ভার:
  - **server status** - সার্ভারের সংস্করণ এবং স্ট্যাটাস তথ্য পান।
  - **server reboot** - সার্ভার সুন্দরভাবে পুনরায় চালু করুন।
  - **server reboot force** - সার্ভার জোর করে পুনরায় চালু করুন।
  {{/commands.server}}

  এই কথোপকথনে একটি **কমান্ড** (কেস সংবেদনশীল নয়) বা **কমান্ড নম্বর** পাঠান।

app.commands.server.disabled: ⛔ **সার্ভার কমান্ড নিষ্ক্রিয় করা হয়েছে**।

  দয়া করে আপনার প্রশাসকের সাথে যোগাযোগ করুন।

  উপলব্ধ কমান্ডের তালিকা পেতে **help** পাঠান।

