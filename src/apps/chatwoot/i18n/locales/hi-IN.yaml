app.connected.message: |-
  🔗 **कनेक्टेड: व्हाट्सएप सत्र से ChatWoot इनबॉक्स**

  ✅ व्हाट्सएप सत्र **{{{name}}}** सफलतापूर्वक इस ChatWoot इनबॉक्स से जुड़ गया है।

  यह इनबॉक्स अब आपके **व्हाट्सएप खाते** से जुड़ा हुआ है। आप यहां से सीधे संदेश भेज और प्राप्त कर सकते हैं — बिल्कुल व्हाट्सएप का उपयोग करने जैसा, लेकिन ChatWoot के अंदर।

  आप इस इनबॉक्स से जुड़े व्हाट्सएप सत्र को भी प्रबंधित कर सकते हैं। उपलब्ध कार्यों को देखने के लिए, इस चैट पर **help** भेजें।

  📋 आप जो सामान्य कार्य कर सकते हैं:
  - जांचें कि क्या व्हाट्सएप सत्र सक्रिय है
  - व्हाट्सएप सत्र को पुनरारंभ या बंद करें
  - लॉग आउट करें और नए QR कोड को स्कैन करके फिर से कनेक्ट करें

  यदि सब कुछ काम कर रहा है, तो आप स्वतंत्र रूप से चैट कर पाएंगे। यदि आप चेतावनियां देखते हैं, तो आपको अपने व्हाट्सएप खाते को फिर से कनेक्ट करने की आवश्यकता हो सकती है।

  चलिए शुरू करते हैं! 🚀

app.disconnected.message: |-
  🔌 **डिस्कनेक्टेड: व्हाट्सएप सत्र से ChatWoot इनबॉक्स**

  ❌ व्हाट्सएप सत्र **{{{name}}}** इस ChatWoot इनबॉक्स से डिस्कनेक्ट हो गया है।

  आप अब व्हाट्सएप से संदेश भेज या प्राप्त नहीं कर पाएंगे।

  फिर से कनेक्ट करने के लिए, कृपया अपने प्रशासक से संपर्क करें।

app.updated.message: |-
  🔄 **अपडेटेड: व्हाट्सएप सत्र सेटिंग्स**

  ✅ व्हाट्सएप सत्र **{{{name}}}** की सेटिंग्स अपडेट की गई हैं।

app.commands.list: |-
  आप निम्न कमांड में से एक भेजकर **व्हाट्सएप इंटीग्रेशन** का प्रबंधन कर सकते हैं:

  🖥️ **सेशन**:
  1. **status** - वर्तमान सत्र स्थिति प्राप्त करें।
  2. **restart** - सत्र को पुनरारंभ करें - यह आपके व्हाट्सएप खाते को फिर से कनेक्ट करने का प्रयास करेगा।
  3. **start** - सत्र शुरू करें।
  4. **stop** - सत्र बंद करें।
  5. **logout** - सत्र से लॉग आउट करें, ताकि आप QR कोड स्कैन कर सकें और सत्र को मरम्मत कर सकें।
  6. **qr** - सत्र के लिए QR कोड प्राप्त करें।
  7. **screenshot** - सत्र का स्क्रीनशॉट प्राप्त करें (केवल **WEBJS** इंजन में उपलब्ध)।
  8. **help** - उपलब्ध कमांड।

  {{#commands.server}}
  ⚙️ सर्वर:
  - **server status** - सर्वर संस्करण और स्थिति जानकारी प्राप्त करें।
  - **server reboot** - सर्वर को सुचारू रूप से पुनरारंभ करें।
  - **server reboot force** - सर्वर को जबरदस्ती पुनरारंभ करें।
  {{/commands.server}}

  इस वार्तालाप में **कमांड** (केस इनसेंसिटिव) या **कमांड नंबर** भेजें।

app.commands.server.disabled: ⛔ **सर्वर कमांड अक्षम हैं**।

  कृपया अपने व्यवस्थापक से संपर्क करें।

  उपलब्ध कमांड की सूची पाने के लिए **help** भेजें।

