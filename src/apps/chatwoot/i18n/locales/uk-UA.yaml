waha.core.version.used: |-
  ❤️ **Підтримайте WAHA!**

  Ви використовуєте безкоштовну версію **WAHA Core**. Якщо ви вважаєте цей проект корисним, будь ласка, розгляньте можливість підтримати його розробку.

  Ваша підтримка - єдиний спосіб, яким ми можемо продовжувати працювати над оновленнями, виправленнями та новими функціями.

  [**🎁 Підтримайте нас**]({{{supportUrl}}})

