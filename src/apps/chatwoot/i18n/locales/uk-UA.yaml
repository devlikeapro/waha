app.connected.message: |-
  🔗 **ПІДКЛЮЧЕНО: Сесія WhatsApp до Вхідних ChatWoot**

  ✅ Сесія WhatsApp **{{{name}}}** була успішно підключена до цих Вхідних ChatWoot.

  Ці вхідні тепер пов'язані з вашим **Обліковим записом WhatsApp**. Ви можете надсилати та отримувати повідомлення безпосередньо звідси — так само, як використовуючи WhatsApp, але всередині ChatWoot.

  Ви також можете керувати сесією WhatsApp, пов'язаною з цими вхідними. Щоб переглянути доступні дії, надішліть **help** у цей чат.

  📋 Загальні дії, які ви можете виконати:
  - Перевірити, чи активна сесія WhatsApp
  - Перезапустити або Зупинити сесію WhatsApp
  - Вийти та повторно підключитися, відсканувавши новий QR-код

  Якщо все працює, ви зможете вільно спілкуватися. Якщо ви бачите попередження, можливо, вам потрібно повторно підключити свій обліковий запис WhatsApp.

  Давайте почнемо! 🚀

app.disconnected.message: |-
  🔌 **ВІДКЛЮЧЕНО: Сесія WhatsApp від Вхідних ChatWoot**

  ❌ Сесія WhatsApp **{{{name}}}** була відключена від цих Вхідних ChatWoot.

  Ви більше не зможете надсилати або отримувати повідомлення з WhatsApp.

  Щоб повторно підключитися, зверніться до свого адміністратора.

app.updated.message: |-
  🔄 **ОНОВЛЕНО: Налаштування сесії WhatsApp**

  ✅ Налаштування для сесії WhatsApp **{{{name}}}** були оновлені.

app.commands.list: |-
  Ви можете керувати **Інтеграцією WhatsApp**, надіславши одну з наступних команд:

  🖥️ **Сесія**:
  1. **status** - отримати поточний статус сесії.
  2. **restart** - перезапустити сесію - це спробує повторно підключити ваш обліковий запис WhatsApp.
  3. **start** - запустити сесію.
  4. **stop** - зупинити сесію.
  5. **logout** - вийти з сесії, щоб ви могли відсканувати QR-код і відновити сесію.
  6. **qr** - отримати QR-код для сесії.
  7. **screenshot** - отримати знімок екрану сесії (доступно лише в двигуні **WEBJS**).
  8. **help** - доступні команди.

  {{#commands.server}}
  ⚙️ Сервер:
  - **server status** - отримати інформацію про версію та статус сервера.
  - **server reboot** - перезавантажити сервер плавно.
  - **server reboot force** - примусово перезавантажити сервер.
  {{/commands.server}}

  Надішліть **команду** (без урахування регістру) або **номер команди** у цю розмову.

app.commands.server.disabled: ⛔ **Команди сервера вимкнені**.

  Будь ласка, зв’яжіться з вашим адміністратором.

  Надішліть **help**, щоб отримати список доступних команд.

app.help.reminder: |-
  Надішліть **help**, щоб отримати список доступних команд.

